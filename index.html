<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Trainer — 書いて覚えるPython</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel2: #1e222e;
    --border: #2a2f3e;
    --text: #d7dae3;
    --dim: #8a90a3;
    --accent: #4d9fec;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    height: 100vh; display: flex; overflow: hidden;
  }

  /* ---- sidebar ---- */
  #sidebar {
    width: 260px; min-width: 260px; background: var(--panel);
    border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 0;
  }
  #sidebar h1 { font-size: 16px; padding: 0 16px 4px; color: var(--accent); }
  #sidebar .sub { font-size: 11px; color: var(--dim); padding: 0 16px 12px; }
  #progressbar { height: 6px; background: var(--panel2); border-radius: 3px; margin: 0 16px 16px; overflow: hidden; }
  #progressbar > div { height: 100%; background: var(--green); width: 0%; transition: width .3s; }
  .chapter { font-size: 12px; color: var(--dim); padding: 12px 16px 4px; font-weight: 600; }
  .lesson {
    padding: 7px 16px 7px 28px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent;
  }
  .lesson:hover { background: var(--panel2); }
  .lesson.active { background: var(--panel2); border-left-color: var(--accent); }
  .lesson .mark { width: 16px; text-align: center; color: var(--dim); }
  .lesson.done .mark { color: var(--green); }
  .lesson.review .mark { color: var(--yellow); }

  /* ---- main ---- */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #desc {
    padding: 20px 24px; overflow-y: auto; max-height: 38%;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  #desc h2 { font-size: 18px; margin-bottom: 8px; }
  #desc p { font-size: 14px; line-height: 1.7; margin-bottom: 8px; color: var(--text); }
  #desc a { color: var(--accent); }
  #desc code, #output code {
    font-family: var(--mono); font-size: 12.5px; background: var(--panel2);
    padding: 1px 5px; border-radius: 4px; color: var(--yellow);
  }
  #desc pre {
    background: var(--panel2); padding: 10px 12px; border-radius: 6px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
    margin: 8px 0; overflow-x: auto; color: var(--text);
  }
  .task { border-left: 3px solid var(--accent); padding-left: 10px; margin-top: 10px; }
  .resbox {
    margin-top: 12px; padding: 8px 12px; background: var(--panel2);
    border-radius: 6px; font-size: 12.5px; color: var(--dim); line-height: 1.7;
  }

  #editorwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #toolbar {
    display: flex; gap: 8px; padding: 8px 24px; align-items: center;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0b0d12; border: none; font-weight: 600; }
  button.primary:hover { opacity: .9; }
  #toolbar .spacer { flex: 1; }
  #toolbar .kbd { font-size: 11px; color: var(--dim); }

  #editor {
    flex: 1; width: 100%; background: var(--bg); color: var(--text); border: none;
    resize: none; outline: none; padding: 14px 24px;
    font-family: var(--mono); font-size: 14px; line-height: 1.6; tab-size: 4;
  }

  #output {
    height: 32%; min-height: 140px; overflow-y: auto; background: var(--panel);
    border-top: 1px solid var(--border); padding: 12px 24px; font-size: 13px;
  }
  #output .test { font-family: var(--mono); font-size: 12.5px; padding: 3px 0; }
  #output .pass { color: var(--green); }
  #output .fail { color: var(--red); }
  #output .err { color: var(--red); font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; }
  #output .log { color: var(--dim); font-family: var(--mono); font-size: 12.5px; }
  #output .celebrate { color: var(--green); font-weight: 600; margin-top: 8px; }
  #output .review-note { color: var(--yellow); font-weight: 600; margin-top: 8px; }
  #output .muted { color: var(--dim); }
  .hintbox {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin-top: 10px; font-size: 13px; line-height: 1.7;
  }
  .hintbox pre { background: var(--bg); padding: 8px 10px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; margin-top: 6px; overflow-x: auto; }

  /* ---- スマホ幅: 横並びをやめて、縦に積んでページごとスクロールする ---- */
  @media (max-width: 720px) {
    body { display: block; height: auto; overflow: auto; }
    #sidebar {
      width: auto; min-width: 0; max-height: 40vh;
      border-right: none; border-bottom: 1px solid var(--border);
    }
    #main { overflow: visible; }
    #desc { max-height: none; padding: 16px; }
    #toolbar { flex-wrap: wrap; padding: 8px 16px; }
    #toolbar .kbd { display: none; }
    #editor { min-height: 45vh; padding: 12px 16px; font-size: 16px; } /* 16px 未満だと iOS が入力時に拡大する */
    #output { height: auto; padding: 12px 16px; }
  }
</style>
</head>
<body>

<nav id="sidebar">
  <h1>Python Trainer</h1>
  <div class="sub" id="subline">書いて覚えるPython</div>
  <div id="progressbar"><div></div></div>
  <div id="nav"></div>
</nav>

<div id="main">
  <div id="desc"></div>
  <div id="editorwrap">
    <div id="toolbar">
      <button class="primary" id="btn-run">▶ 実行して採点</button>
      <button id="btn-hint">ヒント</button>
      <button id="btn-solution">解答例</button>
      <button id="btn-reset">リセット</button>
      <span class="spacer"></span>
      <span class="kbd">⌘+Enter / Ctrl+Enter で実行</span>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>
  <div id="output"><span class="muted">コードを書いて「実行して採点」を押してください。</span></div>
</div>

<script id="data">
"use strict";
const PAYLOAD = {"mode": "static", "chapters": [{"title": "第1章 基本", "resources": [{"label": "公式チュートリアル: 形式ばらない入門", "url": "https://docs.python.org/ja/3/tutorial/introduction.html"}, {"label": "公式チュートリアル: データ構造", "url": "https://docs.python.org/ja/3/tutorial/datastructures.html"}, {"label": "Automate the Boring Stuff Ch.1", "url": "https://automatetheboringstuff.com/2e/chapter1/"}], "lessons": [{"id": "variables", "title": "変数と型", "desc": "<h2>1-1. 変数と型 — 名前に値を入れる<\/h2>\n<p>Pythonの変数は <code>名前 = 値<\/code> と書くだけ。JS/TSと違って <code>let<\/code> も <code>const<\/code> も型注釈も不要で、<b>入れた値で型が決まります<\/b>。基本の型は4つ:<\/p>\n<pre>song = \"Aurora\"      # str（文字列。\" でも ' でもOK）\ncount = 3            # int（整数）\ngain = 0.5           # float（小数点があると float）\nmuted = True         # bool（True / False — 先頭が大文字！JSの true とは違う）<\/pre>\n<p>値の型は <code>type(count)<\/code> で確認できます。<\/p>\n<p class=\"task\"><b>課題:<\/b> コメントの指定どおりに4つの変数を作ってください。<\/p>", "starter": "# title      … 文字列 \"Night Drive\"\n# bpm        … 整数 128\n# volume     … 小数 0.8\n# is_playing … 真偽値 False\n", "hint": "title = \"Night Drive\" のように1行ずつ書くだけです。False の先頭は大文字。0.8 はそのまま小数点つきで。", "solution": "title = \"Night Drive\"\nbpm = 128\nvolume = 0.8\nis_playing = False", "checks": [{"kind": "eq", "name": "title は文字列 \"Night Drive\"", "expr": "title", "want": "'Night Drive'", "type": "str"}, {"kind": "eq", "name": "bpm は整数 128", "expr": "bpm", "want": "128", "type": "int"}, {"kind": "eq", "name": "volume は小数 0.8", "expr": "volume", "want": "0.8", "type": "float"}, {"kind": "eq", "name": "is_playing は真偽値 False", "expr": "is_playing", "want": "False", "type": "bool"}]}, {"id": "fstring", "title": "f-string と print", "desc": "<h2>1-2. f-string — 文字列に値を埋め込む<\/h2>\n<p>文字列の前に <code>f<\/code> を付けると、中の <code>{ }<\/code> に変数や式を埋め込めます。JSのテンプレートリテラル <code>`${name}`<\/code> のPython版です。<\/p>\n<pre>artist = \"Rin\"\nline = f\"演奏: {artist}\"        # → \"演奏: Rin\"\ntotal = f\"{1500 * 2:,}円\"       # → \"3,000円\"（:, は3桁区切りの書式指定）<\/pre>\n<p>画面への出力は <code>print(line)<\/code>。<code>console.log<\/code> にあたります。<\/p>\n<p class=\"task\"><b>課題:<\/b> f-string を使って <code>intro<\/code> と <code>msg<\/code> を作り、<code>intro<\/code> を print してください。<\/p>", "starter": "name = \"Miku\"\nage = 16\nprice = 1980\n\n# intro … 「Miku（16歳）」という文字列（f-string で name と age を埋め込む）\n# msg   … 「合計: 1,980円」という文字列（:, で3桁区切りに）\n# intro を print する\n", "hint": "intro = f\"{name}（{age}歳）\"、msg = f\"合計: {price:,}円\"。最後に print(intro) です。", "solution": "name = \"Miku\"\nage = 16\nprice = 1980\n\nintro = f\"{name}（{age}歳）\"\nmsg = f\"合計: {price:,}円\"\nprint(intro)", "checks": [{"kind": "source", "name": "f-string を使っている", "pattern": "f[\"']", "detail": "文字列の前に f を付けます（例: f\"{name}\"）"}, {"kind": "eq", "name": "intro が「Miku（16歳）」", "expr": "intro", "want": "'Miku（16歳）'"}, {"kind": "eq", "name": "msg が「合計: 1,980円」", "expr": "msg", "want": "'合計: 1,980円'"}, {"kind": "stdout", "name": "intro を print している", "contains": "Miku（16歳）"}]}, {"id": "slice", "title": "スライス", "desc": "<h2>1-3. スライス — 文字列を切り出す<\/h2>\n<p><code>word[開始:終了]<\/code> で部分文字列を切り出せます。<b>終了は含まない<\/b>のがポイント。負の数は「後ろから数える」、省略は「端まで」という意味です。<\/p>\n<pre>word = \"keyboard\"\nword[0]      # \"k\"（1文字の取り出し）\nword[:3]     # \"key\"（最初の3文字）\nword[-2:]    # \"rd\"（最後の2文字）\nword[1:-1]   # \"eyboar\"（最初と最後を除く）\nword[::-1]   # \"draobyek\"（ステップ -1 = 逆順）<\/pre>\n<p>スライスはリストにもそのまま使えます。<\/p>\n<p class=\"task\"><b>課題:<\/b> <code>word<\/code> からコメントの指定どおりに4つの変数を切り出してください。<\/p>", "starter": "word = \"synthesizer\"\n\n# first3        … 最初の3文字 \"syn\"\n# last3         … 最後の3文字 \"zer\"\n# inner         … 最初と最後の1文字を除いた \"ynthesize\"\n# reversed_word … 逆順 \"rezisehtnys\"（[::-1] を使う）\n", "hint": "first3 = word[:3]、last3 = word[-3:]、inner = word[1:-1]、reversed_word = word[::-1] です。", "solution": "word = \"synthesizer\"\n\nfirst3 = word[:3]\nlast3 = word[-3:]\ninner = word[1:-1]\nreversed_word = word[::-1]", "checks": [{"kind": "eq", "name": "first3 は \"syn\"", "expr": "first3", "want": "'syn'"}, {"kind": "eq", "name": "last3 は \"zer\"", "expr": "last3", "want": "'zer'"}, {"kind": "eq", "name": "inner は \"ynthesize\"", "expr": "inner", "want": "'ynthesize'"}, {"kind": "eq", "name": "reversed_word は \"rezisehtnys\"", "expr": "reversed_word", "want": "'rezisehtnys'"}, {"kind": "source", "name": "[::-1] で逆順にしている", "pattern": "\\[\\s*:\\s*:\\s*-1\\s*\\]", "detail": "reversed_word は word[::-1] と書きます"}]}, {"id": "list_dict", "title": "リストと辞書", "desc": "<h2>1-4. リストと辞書 — 一番よく使う入れ物<\/h2>\n<p><b>リスト<\/b>はJSの配列。<code>.append()<\/code> で末尾に追加し、<code>[0]<\/code> で取り出します。<b>辞書（dict）<\/b>はJSのオブジェクトに近いキーと値のペアで、<code>d[\"key\"]<\/code> で読み書きします（<code>d.key<\/code> とは書けません）。<\/p>\n<pre>chords = [\"Am\", \"F\"]\nchords.append(\"C\")      # [\"Am\", \"F\", \"C\"]\nfirst = chords[0]       # \"Am\"\n\nsong = {\"artist\": \"Rin\", \"year\": 2026}\nsong[\"genre\"] = \"pop\"   # キーの追加も代入するだけ\nyear = song[\"year\"]     # 2026<\/pre>\n<p class=\"task\"><b>課題:<\/b> コメントの4つの操作を上から順に書いてください。<\/p>", "starter": "notes = [\"C\", \"E\", \"G\"]\ntrack = {\"title\": \"Voyage\", \"bpm\": 128}\n\n# 1) notes の末尾に \"B\" を追加する（.append を使う）\n# 2) first_note に notes の最初の要素を入れる\n# 3) track に \"genre\" キーを追加して値を \"techno\" にする\n# 4) bpm に track の \"bpm\" の値を取り出す\n", "hint": "notes.append(\"B\") → first_note = notes[0] → track[\"genre\"] = \"techno\" → bpm = track[\"bpm\"] の順です。", "solution": "notes = [\"C\", \"E\", \"G\"]\ntrack = {\"title\": \"Voyage\", \"bpm\": 128}\n\nnotes.append(\"B\")\nfirst_note = notes[0]\ntrack[\"genre\"] = \"techno\"\nbpm = track[\"bpm\"]", "checks": [{"kind": "source", "name": ".append を使っている", "pattern": "\\.append\\s*\\(", "detail": "notes.append(\"B\") と書きます"}, {"kind": "eq", "name": "notes の末尾に \"B\" が追加されている", "expr": "notes", "want": "['C', 'E', 'G', 'B']"}, {"kind": "eq", "name": "first_note は \"C\"", "expr": "first_note", "want": "'C'"}, {"kind": "eq", "name": "track に genre が追加されている", "expr": "track", "want": "{'title': 'Voyage', 'bpm': 128, 'genre': 'techno'}"}, {"kind": "eq", "name": "bpm は 128", "expr": "bpm", "want": "128"}]}, {"id": "tuple_set", "title": "タプルとセット", "desc": "<h2>1-5. タプルとセット — 変えない・重複しない<\/h2>\n<p><b>タプル<\/b>は「変更できないリスト」。<code>(3, 4)<\/code> のように作り、<code>x, y = point<\/code> で一気に複数の変数に展開できます（アンパック）。座標やペアなど「セットで1つ」の値に使います。<\/p>\n<p><b>セット（set）<\/b>は「重複のない集合」。リストを <code>set()<\/code> に通すと重複が消えます。順番は保証されません。<\/p>\n<pre>pair = (60, 100)         # タプル\nnote, velocity = pair    # アンパック\n\ntags = set([\"rock\", \"pop\", \"rock\"])   # {\"rock\", \"pop\"} — 重複が消える\n\"pop\" in tags                          # True（含まれるか確認）<\/pre>\n<p class=\"task\"><b>課題:<\/b> アンパックとセットを使って、コメントの3つを書いてください。<\/p>", "starter": "point = (3, 4)\ngenres = [\"techno\", \"house\", \"techno\", \"techno\", \"house\"]\n\n# 1) x, y = point の形で、タプルを2つの変数に展開する\n# 2) unique に genres の重複を除いたセットを作る（set() を使う）\n# 3) count に unique の要素数を入れる（len() を使う）\n", "hint": "x, y = point → unique = set(genres) → count = len(unique) の3行です。", "solution": "point = (3, 4)\ngenres = [\"techno\", \"house\", \"techno\", \"techno\", \"house\"]\n\nx, y = point\nunique = set(genres)\ncount = len(unique)", "checks": [{"kind": "source", "name": "set() を使っている", "pattern": "\\bset\\s*\\(", "detail": "unique = set(genres) と書きます"}, {"kind": "eq", "name": "x は 3", "expr": "x", "want": "3"}, {"kind": "eq", "name": "y は 4", "expr": "y", "want": "4"}, {"kind": "eq", "name": "unique は {'techno', 'house'}", "expr": "unique", "want": "{'techno', 'house'}"}, {"kind": "eq", "name": "count は 2", "expr": "count", "want": "2"}]}]}, {"title": "第2章 制御・関数", "resources": [{"label": "公式チュートリアル: 制御構造", "url": "https://docs.python.org/ja/3/tutorial/controlflow.html"}, {"label": "Automate the Boring Stuff Ch.2 (Flow Control)", "url": "https://automatetheboringstuff.com/2e/chapter2/"}, {"label": "Automate the Boring Stuff Ch.3 (Functions)", "url": "https://automatetheboringstuff.com/2e/chapter3/"}], "lessons": [{"id": "def_basics", "title": "関数の基本", "desc": "<h2>2-1. 関数 — def と return とインデント<\/h2>\n<p>関数は <code>def 名前(引数):<\/code> で定義します。JSの <code>{ }<\/code> の代わりに、Pythonは<b>コロン + インデント（字下げ4つ）<\/b>で中身の範囲を表します。インデントが文法の一部なのがPython最大の特徴です。<\/p>\n<pre>def add(a, b):\n    return a + b    # ← 半角スペース4つ下げる\n\nadd(1, 2)           # → 3<\/pre>\n<p><code>return<\/code> を忘れると <code>None<\/code>（JSの <code>undefined<\/code> にあたる「何もない」値）が返ります。<\/p>\n<p class=\"task\"><b>課題:<\/b> 関数 <code>describe_track(title, seconds)<\/code> を定義してください。<code>\"Voyage（245秒）\"<\/code> のような文字列を f-string で作って return します。<\/p>", "starter": "# 関数 describe_track(title, seconds) を定義する\n# 例: describe_track(\"Voyage\", 245) → \"Voyage（245秒）\"\n", "hint": "def describe_track(title, seconds): の次の行を4つ下げて、return f\"{title}（{seconds}秒）\" です。", "solution": "def describe_track(title, seconds):\n    return f\"{title}（{seconds}秒）\"", "checks": [{"kind": "source", "name": "def で定義している", "pattern": "def\\s+describe_track\\s*\\(", "detail": "def describe_track(title, seconds): と書きます"}, {"kind": "source", "name": "return している", "pattern": "\\breturn\\b", "detail": "print ではなく return で値を返します"}, {"kind": "eq", "name": "describe_track(\"Voyage\", 245)", "expr": "describe_track('Voyage', 245)", "want": "'Voyage（245秒）'"}, {"kind": "eq", "name": "describe_track(\"Demo\", 30)", "expr": "describe_track('Demo', 30)", "want": "'Demo（30秒）'"}]}, {"id": "if_elif", "title": "if / elif / else", "desc": "<h2>2-2. if / elif / else — 条件分岐<\/h2>\n<p>JSの <code>else if<\/code> はPythonでは <code>elif<\/code>。条件のカッコは不要で、ここでもコロンとインデントで範囲を表します。<code>&amp;&amp;<\/code> / <code>||<\/code> / <code>!<\/code> は <code>and<\/code> / <code>or<\/code> / <code>not<\/code> と英単語で書きます。<\/p>\n<pre>def volume_label(v):\n    if v == 0:\n        return \"無音\"\n    elif v &lt; 50:\n        return \"小さい\"\n    else:\n        return \"大きい\"<\/pre>\n<p class=\"task\"><b>課題:<\/b> 関数 <code>tempo_label(bpm)<\/code> を作ってください。100未満なら <code>\"slow\"<\/code>、100以上140以下なら <code>\"mid\"<\/code>、それより大きければ <code>\"fast\"<\/code> を返します。<\/p>", "starter": "def tempo_label(bpm):\n    # 100未満 → \"slow\" / 100〜140 → \"mid\" / それ以上 → \"fast\"\n    pass\n", "hint": "if bpm < 100: → elif bpm <= 140: → else: の3段です。pass（何もしない仮置き）は消してください。", "solution": "def tempo_label(bpm):\n    if bpm < 100:\n        return \"slow\"\n    elif bpm <= 140:\n        return \"mid\"\n    else:\n        return \"fast\"", "checks": [{"kind": "source", "name": "elif を使っている", "pattern": "\\belif\\b", "detail": "else if ではなく elif と書きます"}, {"kind": "eq", "name": "tempo_label(90) → slow", "expr": "tempo_label(90)", "want": "'slow'"}, {"kind": "eq", "name": "tempo_label(100) → mid（境界値）", "expr": "tempo_label(100)", "want": "'mid'"}, {"kind": "eq", "name": "tempo_label(140) → mid（境界値）", "expr": "tempo_label(140)", "want": "'mid'"}, {"kind": "eq", "name": "tempo_label(170) → fast", "expr": "tempo_label(170)", "want": "'fast'"}]}, {"id": "for_while", "title": "for と while", "desc": "<h2>2-3. for と while — 繰り返し<\/h2>\n<p>Pythonの <code>for<\/code> はJSの <code>for...of<\/code> にあたり、<b>要素を直接<\/b>取り出します。回数で回したいときは <code>range(n)<\/code>（0〜n-1）を使います。<code>while<\/code> は条件が真の間繰り返します。<\/p>\n<pre>for note in [\"C\", \"E\", \"G\"]:\n    print(note)\n\nn = 3\nwhile n &gt; 0:\n    n = n - 1    # n -= 1 とも書ける<\/pre>\n<p class=\"task\"><b>課題:<\/b> 2つの関数を作ってください。<code>total_seconds(durations)<\/code> は for で合計を足し上げて返す（練習なので <code>sum()<\/code> は使わない）。<code>countdown(n)<\/code> は while で <code>[n, n-1, …, 1]<\/code> のリストを作って返す。<\/p>", "starter": "def total_seconds(durations):\n    # for で1つずつ足し上げる（sum() は使わない）\n    pass\n\n\ndef countdown(n):\n    # while で [n, n-1, ..., 1] のリストを作る\n    pass\n", "hint": "total = 0 を用意して for d in durations: total += d。countdown は result = [] に while n > 0: で append して n -= 1。", "solution": "def total_seconds(durations):\n    total = 0\n    for d in durations:\n        total += d\n    return total\n\n\ndef countdown(n):\n    result = []\n    while n > 0:\n        result.append(n)\n        n -= 1\n    return result", "checks": [{"kind": "source", "name": "for を使っている", "pattern": "\\bfor\\b", "detail": "for d in durations: の形で回します"}, {"kind": "source", "name": "while を使っている", "pattern": "\\bwhile\\b", "detail": "countdown は while で書きます"}, {"kind": "source", "name": "sum() を使っていない（今回は手で足す練習）", "pattern": "\\bsum\\s*\\(", "not": true, "detail": "今回は sum() を使わず、for で足し上げてください"}, {"kind": "eq", "name": "total_seconds([30, 90, 120])", "expr": "total_seconds([30, 90, 120])", "want": "240"}, {"kind": "eq", "name": "total_seconds([])", "expr": "total_seconds([])", "want": "0"}, {"kind": "eq", "name": "countdown(3)", "expr": "countdown(3)", "want": "[3, 2, 1]"}, {"kind": "eq", "name": "countdown(0)", "expr": "countdown(0)", "want": "[]"}]}, {"id": "comprehension", "title": "内包表記", "desc": "<h2>2-4. 内包表記 — リストを1行で作る<\/h2>\n<p>「forで回して新しいリストを作る」処理は、Pythonでは<b>リスト内包表記<\/b>で1行に書けます。JSの <code>map<\/code> / <code>filter<\/code> にあたる、Pythonで一番よく見る書き方です。<\/p>\n<pre>nums = [1, 2, 3, 4]\n[n * 10 for n in nums]              # [10, 20, 30, 40]（map相当）\n[n for n in nums if n % 2 == 0]     # [2, 4]（filter相当。if は後ろに付く）<\/pre>\n<p class=\"task\"><b>課題:<\/b> 内包表記で2つの関数を作ってください。<code>double_all(nums)<\/code> は各要素を2倍したリスト、<code>long_titles(titles, min_len)<\/code> は文字数が <code>min_len<\/code> 以上のものだけのリストを返します（文字数は <code>len(t)<\/code>）。<\/p>", "starter": "def double_all(nums):\n    # 内包表記で [各要素の2倍] を返す\n    pass\n\n\ndef long_titles(titles, min_len):\n    # 内包表記で「len(t) が min_len 以上」だけを残す\n    pass\n", "hint": "return [n * 2 for n in nums] と return [t for t in titles if len(t) >= min_len] の各1行です。", "solution": "def double_all(nums):\n    return [n * 2 for n in nums]\n\n\ndef long_titles(titles, min_len):\n    return [t for t in titles if len(t) >= min_len]", "checks": [{"kind": "source", "name": "内包表記を使っている", "pattern": "\\[[^\\]]*\\bfor\\b[^\\]]*\\]", "detail": "[式 for 変数 in リスト] の形で書きます"}, {"kind": "source", "name": ".append を使っていない（内包表記の練習）", "pattern": "\\.append\\s*\\(", "not": true, "detail": "今回は append ではなく内包表記1行で書いてください"}, {"kind": "eq", "name": "double_all([1, 2, 3])", "expr": "double_all([1, 2, 3])", "want": "[2, 4, 6]"}, {"kind": "eq", "name": "double_all([])", "expr": "double_all([])", "want": "[]"}, {"kind": "eq", "name": "long_titles([\"Voyage\", \"Aurora\", \"Sky\"], 4)", "expr": "long_titles(['Voyage', 'Aurora', 'Sky'], 4)", "want": "['Voyage', 'Aurora']"}]}, {"id": "default_args", "title": "デフォルト引数と *args / **kwargs", "desc": "<h2>2-5. 引数いろいろ — デフォルト・*args・**kwargs<\/h2>\n<p>引数には3つの便利な形があります。<\/p>\n<pre>def fade(volume, step=10):      # ① デフォルト値。省略すると 10\n    ...\n\ndef total(*nums):               # ② 何個でも受け取る → nums はタプルになる\n    ...                          #    total(1, 2, 3) → nums = (1, 2, 3)\n\ndef show(**settings):           # ③ キーワード引数を何個でも → 辞書になる\n    ...                          #    show(bpm=120) → settings = {\"bpm\": 120}<\/pre>\n<p class=\"task\"><b>課題:<\/b> 3つの関数を作ってください。<br>\n① <code>fade(volume, step=10)<\/code> — volumeからstepを引く。ただし0未満にしない（<code>max(0, …)<\/code>）<br>\n② <code>total(*nums)<\/code> — 渡された数を全部足す（<code>sum(nums)<\/code> でOK）<br>\n③ <code>show_config(**settings)<\/code> — <code>\"bpm=120, vol=0.8\"<\/code> のようにキー順（<code>sorted<\/code>）で並べた文字列を返す<\/p>", "starter": "def fade(volume, step=10):\n    pass\n\n\n# total(*nums) をここに定義\n\n\n# show_config(**settings) をここに定義\n# ヒント: \", \".join(f\"{k}={v}\" for k, v in sorted(settings.items()))\n", "hint": "fade は return max(0, volume - step)。total は def total(*nums): return sum(nums)。show_config はヒントの join の1行を return します。", "solution": "def fade(volume, step=10):\n    return max(0, volume - step)\n\n\ndef total(*nums):\n    return sum(nums)\n\n\ndef show_config(**settings):\n    return \", \".join(f\"{k}={v}\" for k, v in sorted(settings.items()))", "checks": [{"kind": "source", "name": "step=10 のデフォルト引数", "pattern": "step\\s*=\\s*10", "detail": "def fade(volume, step=10): と書きます"}, {"kind": "source", "name": "*nums を使っている", "pattern": "\\*\\s*nums", "detail": "def total(*nums): と書きます"}, {"kind": "source", "name": "**settings を使っている", "pattern": "\\*\\*\\s*settings", "detail": "def show_config(**settings): と書きます"}, {"kind": "eq", "name": "fade(80) → 70（step省略）", "expr": "fade(80)", "want": "70"}, {"kind": "eq", "name": "fade(80, 30) → 50", "expr": "fade(80, 30)", "want": "50"}, {"kind": "eq", "name": "fade(5) は 0 で止まる", "expr": "fade(5)", "want": "0"}, {"kind": "eq", "name": "total(1, 2, 3) → 6", "expr": "total(1, 2, 3)", "want": "6"}, {"kind": "eq", "name": "total() → 0", "expr": "total()", "want": "0"}, {"kind": "eq", "name": "show_config(bpm=120, vol=0.8)", "expr": "show_config(bpm=120, vol=0.8)", "want": "'bpm=120, vol=0.8'"}]}, {"id": "lambda_basics", "title": "lambda", "desc": "<h2>2-6. lambda — 1行の無名関数<\/h2>\n<p><code>lambda 引数: 式<\/code> で、名前を付けずに小さな関数を作れます。JSのアロー関数 <code>x =&gt; x * 2<\/code> にあたります。<code>return<\/code> は書かず、式の結果がそのまま返ります。<\/p>\n<pre>double = lambda x: x * 2\ndouble(5)    # → 10<\/pre>\n<p>本領を発揮するのは第3章の <code>sorted(key=...)<\/code> のように「関数を渡す」場面です。ここでは形に慣れましょう。<\/p>\n<p class=\"task\"><b>課題:<\/b> lambda で2つの関数を作ってください（<code>def<\/code> は使わない）。<code>half<\/code> は半分にする（<code>x / 2<\/code>）、<code>shout<\/code> は大文字にして <code>\"!\"<\/code> を付ける（<code>s.upper() + \"!\"<\/code>）。<\/p>", "starter": "# half  … 半分にする lambda（例: half(10) → 5.0）\n# shout … 大文字 + \"!\" にする lambda（例: shout(\"mix\") → \"MIX!\"）\n", "hint": "half = lambda x: x / 2、shout = lambda s: s.upper() + \"!\" の2行です。", "solution": "half = lambda x: x / 2\nshout = lambda s: s.upper() + \"!\"", "checks": [{"kind": "source", "name": "lambda を使っている", "pattern": "\\blambda\\b", "detail": "half = lambda x: ... の形で書きます"}, {"kind": "source", "name": "def を使っていない（lambdaの練習）", "pattern": "\\bdef\\b", "not": true, "detail": "今回は def ではなく lambda で書いてください"}, {"kind": "eq", "name": "half(10) → 5.0", "expr": "half(10)", "want": "5.0"}, {"kind": "eq", "name": "half(7) → 3.5", "expr": "half(7)", "want": "3.5"}, {"kind": "eq", "name": "shout(\"mix\") → \"MIX!\"", "expr": "shout('mix')", "want": "'MIX!'"}]}]}, {"title": "第3章 データ操作", "resources": [{"label": "公式チュートリアル: データ構造", "url": "https://docs.python.org/ja/3/tutorial/datastructures.html"}, {"label": "公式チュートリアル: 入力と出力", "url": "https://docs.python.org/ja/3/tutorial/inputoutput.html"}, {"label": "Automate the Boring Stuff Ch.9 (Files)", "url": "https://automatetheboringstuff.com/2e/chapter9/"}], "lessons": [{"id": "sorted_key", "title": "sorted と key", "desc": "<h2>3-1. sorted — 並べ替えの決定版<\/h2>\n<p><code>sorted(リスト)<\/code> は<b>新しい<\/b>並べ替え済みリストを返します（元は変えない）。<code>.sort()<\/code> は元を書き換えるので、基本は <code>sorted<\/code> を使いましょう。<\/p>\n<p>並べ替えの基準は <code>key=関数<\/code> で渡します。前章の lambda の出番です。<\/p>\n<pre>sorted([\"bb\", \"a\", \"ccc\"], key=len)              # 文字数順\nsorted(nums, reverse=True)                        # 大きい順\nsorted(tracks, key=lambda t: t[\"plays\"])          # 辞書の値で並べ替え<\/pre>\n<p class=\"task\"><b>課題:<\/b> 2つの関数を作ってください。<code>sort_by_length(words)<\/code> は文字数の短い順。<code>top_played(tracks)<\/code> は <code>{\"title\": …, \"plays\": …}<\/code> の辞書リストを再生数の<b>多い順<\/b>に（<code>reverse=True<\/code>）。どちらも <code>.sort()<\/code> ではなく <code>sorted<\/code> で。<\/p>", "starter": "def sort_by_length(words):\n    # 文字数の短い順（key=len）\n    pass\n\n\ndef top_played(tracks):\n    # plays の多い順（key=lambda ..., reverse=True）\n    pass\n", "hint": "return sorted(words, key=len) と return sorted(tracks, key=lambda t: t[\"plays\"], reverse=True) です。", "solution": "def sort_by_length(words):\n    return sorted(words, key=len)\n\n\ndef top_played(tracks):\n    return sorted(tracks, key=lambda t: t[\"plays\"], reverse=True)", "checks": [{"kind": "source", "name": "key= を使っている", "pattern": "key\\s*=", "detail": "sorted(..., key=...) の形で書きます"}, {"kind": "source", "name": "reverse=True を使っている", "pattern": "reverse\\s*=\\s*True", "detail": "多い順は reverse=True です"}, {"kind": "source", "name": ".sort() を使っていない（元を壊さない）", "pattern": "\\.sort\\s*\\(", "not": true, "detail": "元のリストを変更しない sorted() を使ってください"}, {"kind": "eq", "name": "sort_by_length([\"bb\", \"a\", \"ccc\"])", "expr": "sort_by_length(['bb', 'a', 'ccc'])", "want": "['a', 'bb', 'ccc']"}, {"kind": "eq", "name": "top_played が再生数の多い順", "expr": "[t['title'] for t in top_played([{'title': 'A', 'plays': 10}, {'title': 'B', 'plays': 90}, {'title': 'C', 'plays': 50}])]", "want": "['B', 'C', 'A']"}]}, {"id": "zip_enumerate", "title": "zip と enumerate", "desc": "<h2>3-2. zip と enumerate — forの相棒<\/h2>\n<p>「番号付きで回したい」「2つのリストを同時に回したい」はPython頻出の場面。インデックス変数を手で管理せず、この2つを使います。<\/p>\n<pre>for i, name in enumerate([\"kick\", \"snare\"], 1):   # 1 から番号を振る\n    print(i, name)        # 1 kick / 2 snare\n\nfor name, age in zip([\"Miku\", \"Rin\"], [16, 14]):  # 同じ位置同士をペアに\n    print(name, age)      # Miku 16 / Rin 14<\/pre>\n<p>どちらも内包表記と組み合わせられます。<\/p>\n<p class=\"task\"><b>課題:<\/b> <code>numbered(items)<\/code> は <code>[\"1. kick\", \"2. snare\"]<\/code> のような番号付きリストを（enumerateを1始まりで）、<code>pair_up(names, ages)<\/code> は <code>[\"Miku（16歳）\", …]<\/code> をzipで作って返してください。<\/p>", "starter": "def numbered(items):\n    # enumerate(items, 1) で「1. 名前」のリストに\n    pass\n\n\ndef pair_up(names, ages):\n    # zip で「名前（○歳）」のリストに\n    pass\n", "hint": "return [f\"{i}. {item}\" for i, item in enumerate(items, 1)] と return [f\"{n}（{a}歳）\" for n, a in zip(names, ages)] です。", "solution": "def numbered(items):\n    return [f\"{i}. {item}\" for i, item in enumerate(items, 1)]\n\n\ndef pair_up(names, ages):\n    return [f\"{n}（{a}歳）\" for n, a in zip(names, ages)]", "checks": [{"kind": "source", "name": "enumerate を使っている", "pattern": "\\benumerate\\s*\\(", "detail": "enumerate(items, 1) で1始まりの番号を振ります"}, {"kind": "source", "name": "zip を使っている", "pattern": "\\bzip\\s*\\(", "detail": "zip(names, ages) でペアにします"}, {"kind": "eq", "name": "numbered([\"kick\", \"snare\"])", "expr": "numbered(['kick', 'snare'])", "want": "['1. kick', '2. snare']"}, {"kind": "eq", "name": "numbered([])", "expr": "numbered([])", "want": "[]"}, {"kind": "eq", "name": "pair_up([\"Miku\", \"Rin\"], [16, 14])", "expr": "pair_up(['Miku', 'Rin'], [16, 14])", "want": "['Miku（16歳）', 'Rin（14歳）']"}]}, {"id": "map_filter", "title": "map と filter", "desc": "<h2>3-3. map と filter — 関数を渡して変換・絞り込み<\/h2>\n<p>JSでおなじみの <code>map<\/code> / <code>filter<\/code> はPythonにもあります。ただし返るのはリストではなく「イテレータ」なので、<code>list()<\/code> で包んでリストにします。<\/p>\n<pre>list(map(lambda n: n * 10, [1, 2]))            # [10, 20]\nlist(filter(lambda n: n &gt; 0, [-1, 2, -3]))     # [2]<\/pre>\n<p>実は2-4の内包表記と同じことができます（Pythonでは内包表記の方が好まれる場面が多い）。両方読めるようにしておきましょう。<\/p>\n<p class=\"task\"><b>課題:<\/b> 今回は map / filter の練習です。<code>doubled(nums)<\/code> は map で各要素を2倍に、<code>evens(nums)<\/code> は filter で偶数（<code>n % 2 == 0<\/code>）だけにして返してください。<\/p>", "starter": "def doubled(nums):\n    # map を使う\n    pass\n\n\ndef evens(nums):\n    # filter を使う\n    pass\n", "hint": "return list(map(lambda n: n * 2, nums)) と return list(filter(lambda n: n % 2 == 0, nums)) です。list() を忘れずに。", "solution": "def doubled(nums):\n    return list(map(lambda n: n * 2, nums))\n\n\ndef evens(nums):\n    return list(filter(lambda n: n % 2 == 0, nums))", "checks": [{"kind": "source", "name": "map を使っている", "pattern": "\\bmap\\s*\\(", "detail": "map(lambda n: n * 2, nums) の形で書きます"}, {"kind": "source", "name": "filter を使っている", "pattern": "\\bfilter\\s*\\(", "detail": "filter(lambda n: n % 2 == 0, nums) の形で書きます"}, {"kind": "eq", "name": "doubled([1, 2, 3])", "expr": "doubled([1, 2, 3])", "want": "[2, 4, 6]"}, {"kind": "eq", "name": "evens([1, 2, 3, 4])", "expr": "evens([1, 2, 3, 4])", "want": "[2, 4]"}, {"kind": "eq", "name": "evens([])", "expr": "evens([])", "want": "[]"}]}, {"id": "dict_ops", "title": "辞書の操作", "desc": "<h2>3-4. 辞書の操作 — .get と集計とマージ<\/h2>\n<p><code>d[\"key\"]<\/code> はキーがないとエラー（<code>KeyError<\/code>）になります。<code>d.get(\"key\", 既定値)<\/code> なら、なくても既定値が返って安全。この性質を使うと「出現回数の集計」が定番パターンで書けます。<\/p>\n<pre>counts = {}\nfor g in genres:\n    counts[g] = counts.get(g, 0) + 1   # 初出なら 0 から数え始める<\/pre>\n<p>2つの辞書をまとめるのは <code>{**a, **b}<\/code>（同じキーは後ろが勝つ）。JSのスプレッド <code>{...a, ...b}<\/code> と同じ発想です。<\/p>\n<p class=\"task\"><b>課題:<\/b> <code>count_genres(genres)<\/code> は上のパターンで出現回数の辞書を、<code>merged(a, b)<\/code> は <code>{**a, **b}<\/code> で合体した<b>新しい<\/b>辞書を返してください。<\/p>", "starter": "def count_genres(genres):\n    # .get(g, 0) + 1 のパターンで数える\n    pass\n\n\ndef merged(a, b):\n    # {**a, **b} で新しい辞書に\n    pass\n", "hint": "counts = {} → for g in genres: counts[g] = counts.get(g, 0) + 1 → return counts。merged は return {**a, **b} の1行。", "solution": "def count_genres(genres):\n    counts = {}\n    for g in genres:\n        counts[g] = counts.get(g, 0) + 1\n    return counts\n\n\ndef merged(a, b):\n    return {**a, **b}", "checks": [{"kind": "source", "name": ".get を使っている", "pattern": "\\.get\\s*\\(", "detail": "counts.get(g, 0) の形で書きます"}, {"kind": "eq", "name": "count_genres([\"techno\", \"house\", \"techno\"])", "expr": "count_genres(['techno', 'house', 'techno'])", "want": "{'techno': 2, 'house': 1}"}, {"kind": "eq", "name": "count_genres([])", "expr": "count_genres([])", "want": "{}"}, {"kind": "eq", "name": "merged({\"a\": 1}, {\"b\": 2})", "expr": "merged({'a': 1}, {'b': 2})", "want": "{'a': 1, 'b': 2}"}, {"kind": "eq", "name": "同じキーは後ろの辞書が勝つ", "expr": "merged({'a': 1}, {'a': 9})", "want": "{'a': 9}"}, {"kind": "eq", "name": "元の辞書を変更しない", "expr": "(lambda a: (merged(a, {'b': 2}), a)[1])({'a': 1})", "want": "{'a': 1}"}]}, {"id": "file_io", "title": "ファイル入出力", "desc": "<h2>3-5. ファイル入出力 — 書いて、読む<\/h2>\n<p>ファイルは <code>open(パス, モード)<\/code> で開きます。モードは <code>\"w\"<\/code>（書き込み・上書き）と <code>\"r\"<\/code>（読み込み・省略時はこれ）。日本語を扱うので <code>encoding=\"utf-8\"<\/code> を必ず付けます。<\/p>\n<p>開いたファイルは閉じる必要がありますが、<code>with<\/code> 構文を使うとブロックを抜けたとき<b>自動で<\/b>閉じてくれます。ファイルを開くときは常に with — がPythonのお作法です（仕組みは第4章で）。<\/p>\n<pre>with open(\"log.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"こんにちは\")\n\nwith open(\"log.txt\", encoding=\"utf-8\") as f:\n    text = f.read()<\/pre>\n<p class=\"task\"><b>課題:<\/b> <code>save_memo(text)<\/code> は <code>memo.txt<\/code> にtextを書き込む。<code>load_memo()<\/code> は <code>memo.txt<\/code> を読んで中身を返す。どちらも with を使ってください。（採点は使い捨ての一時フォルダで実行されるので、実際にファイルを作って大丈夫です）<\/p>", "starter": "def save_memo(text):\n    # memo.txt に text を書き込む（with open を使う）\n    pass\n\n\ndef load_memo():\n    # memo.txt を読んで中身を return する\n    pass\n", "hint": "save は with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f: f.write(text)。load は \"r\" で開いて return f.read()（with ブロックの中で return してOK）。", "solution": "def save_memo(text):\n    with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n        f.write(text)\n\n\ndef load_memo():\n    with open(\"memo.txt\", encoding=\"utf-8\") as f:\n        return f.read()", "checks": [{"kind": "source", "name": "with open を使っている", "pattern": "with\\s+open\\s*\\(", "detail": "with open(...) as f: の形で書きます"}, {"kind": "eq", "name": "save_memo が実行できる（返り値はなし）", "expr": "save_memo('今日の練習メモ')", "want": "None"}, {"kind": "eq", "name": "memo.txt に書き込まれている", "expr": "Path('memo.txt').read_text(encoding='utf-8')", "want": "'今日の練習メモ'"}, {"kind": "eq", "name": "load_memo が中身を返す", "expr": "load_memo()", "want": "'今日の練習メモ'"}]}]}, {"title": "第4章 Pythonらしさ", "resources": [{"label": "公式チュートリアル: エラーと例外", "url": "https://docs.python.org/ja/3/tutorial/errors.html"}, {"label": "公式チュートリアル: クラス", "url": "https://docs.python.org/ja/3/tutorial/classes.html"}, {"label": "公式ドキュメント: dataclasses", "url": "https://docs.python.org/ja/3/library/dataclasses.html"}], "lessons": [{"id": "class_basics", "title": "クラスの基本", "desc": "<h2>4-1. クラス — データと処理をまとめる<\/h2>\n<p>クラスは「データ + それを扱う関数（メソッド）」のセットです。<code>__init__<\/code> が作成時に呼ばれる初期化メソッド（JSの <code>constructor<\/code>）。メソッドの第1引数は必ず <code>self<\/code>（自分自身。JSの <code>this<\/code> にあたるものを、Pythonは明示的に書きます）。<\/p>\n<pre>class Timer:\n    def __init__(self, seconds):\n        self.seconds = seconds        # self.○○ = に代入するとプロパティになる\n\n    def label(self):\n        return f\"残り{self.seconds}秒\"\n\nt = Timer(30)      # new は不要\nt.label()          # → \"残り30秒\"<\/pre>\n<p class=\"task\"><b>課題:<\/b> クラス <code>Track<\/code> を作ってください。<code>Track(title, seconds)<\/code> で作成でき、<code>describe()<\/code> メソッドが <code>\"Voyage（245秒）\"<\/code> のような文字列を返します。<\/p>", "starter": "# class Track を定義する\n# Track(\"Voyage\", 245).describe() → \"Voyage（245秒）\"\n", "hint": "class Track: の中に def __init__(self, title, seconds): で self.title と self.seconds に保存し、def describe(self): で f-string を return します。", "solution": "class Track:\n    def __init__(self, title, seconds):\n        self.title = title\n        self.seconds = seconds\n\n    def describe(self):\n        return f\"{self.title}（{self.seconds}秒）\"", "checks": [{"kind": "source", "name": "class Track を定義している", "pattern": "class\\s+Track\\b", "detail": "class Track: と書きます"}, {"kind": "source", "name": "__init__ を定義している", "pattern": "def\\s+__init__\\s*\\(\\s*self", "detail": "def __init__(self, title, seconds): と書きます"}, {"kind": "source", "name": "self. に保存している", "pattern": "self\\.", "detail": "self.title = title のように保存します"}, {"kind": "eq", "name": "Track(\"Voyage\", 245).describe()", "expr": "Track('Voyage', 245).describe()", "want": "'Voyage（245秒）'"}, {"kind": "eq", "name": "title プロパティで取り出せる", "expr": "Track('Demo', 30).title", "want": "'Demo'"}]}, {"id": "dataclass", "title": "dataclass", "desc": "<h2>4-2. dataclass — データの入れ物を1行で<\/h2>\n<p>「データを持つだけのクラス」なら、<code>@dataclass<\/code> を付けるだけで <code>__init__<\/code> や <code>==<\/code> 比較を自動生成してくれます。フィールドは <code>名前: 型<\/code> と書きます — TSでやった型注釈と同じ発想です。<\/p>\n<pre>from dataclasses import dataclass\n\n@dataclass(frozen=True)     # frozen=True で変更禁止（immutable）になる\nclass Note:\n    pitch: str\n    velocity: int\n\nNote(\"C4\", 100) == Note(\"C4\", 100)   # → True（自動で中身を比較！）<\/pre>\n<p>変更したいときは、元を書き換えるのではなく<b>新しいインスタンスを作って返します<\/b>。<\/p>\n<p class=\"task\"><b>課題:<\/b> <code>@dataclass(frozen=True)<\/code> 付きで <code>x: int<\/code> と <code>y: int<\/code> を持つクラス <code>Point<\/code> を定義し、関数 <code>move(p, dx, dy)<\/code> を作ってください。移動後の<b>新しい<\/b> Point を返します。<\/p>", "starter": "from dataclasses import dataclass\n\n# @dataclass(frozen=True) を付けて class Point を定義（x: int と y: int）\n\n\n# 関数 move(p, dx, dy) — 新しい Point(p.x + dx, p.y + dy) を返す\n", "hint": "@dataclass(frozen=True) の次の行に class Point: を書き、中は x: int と y: int の2行。move は return Point(p.x + dx, p.y + dy)。", "solution": "from dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Point:\n    x: int\n    y: int\n\n\ndef move(p, dx, dy):\n    return Point(p.x + dx, p.y + dy)", "checks": [{"kind": "source", "name": "@dataclass を使っている", "pattern": "@\\s*dataclass", "detail": "class の直前の行に @dataclass(frozen=True) と書きます"}, {"kind": "source", "name": "frozen=True にしている", "pattern": "frozen\\s*=\\s*True", "detail": "@dataclass(frozen=True) で変更禁止にします"}, {"kind": "eq", "name": "== で中身が比較できる", "expr": "Point(1, 2) == Point(1, 2)", "want": "True"}, {"kind": "eq", "name": "move(Point(1, 2), 3, 4) → Point(4, 6)", "expr": "move(Point(1, 2), 3, 4) == Point(4, 6)", "want": "True"}, {"kind": "eq", "name": "x が取り出せる", "expr": "Point(1, 2).x", "want": "1"}]}, {"id": "try_except", "title": "try / except", "desc": "<h2>4-3. try / except — 失敗に備える<\/h2>\n<p>失敗しそうな処理は <code>try:<\/code> に書き、失敗したときの処理を <code>except エラー名:<\/code> に書きます（JSの <code>try/catch<\/code>）。Pythonでは<b>捕まえるエラーの種類を指定する<\/b>のがお作法。たとえば <code>int(\"abc\")<\/code> は <code>ValueError<\/code> を投げます。<\/p>\n<pre>try:\n    n = int(text)\nexcept ValueError:          # 「数字じゃなかった」だけを捕まえる\n    n = 0<\/pre>\n<p>裸の <code>except:<\/code>（種類指定なし）は、想定外のバグまで握りつぶすので避けます。<\/p>\n<p class=\"task\"><b>課題:<\/b> 関数 <code>to_int(text, fallback=0)<\/code> を作ってください。<code>int(text)<\/code> を試し、<code>ValueError<\/code> のときは <code>fallback<\/code> を返します。<\/p>", "starter": "def to_int(text, fallback=0):\n    # int(text) を try して、ValueError なら fallback を返す\n    pass\n", "hint": "try: return int(text) → except ValueError: return fallback の4行です。", "solution": "def to_int(text, fallback=0):\n    try:\n        return int(text)\n    except ValueError:\n        return fallback", "checks": [{"kind": "source", "name": "try を使っている", "pattern": "\\btry\\s*:", "detail": "try: のブロックで int(text) を試します"}, {"kind": "source", "name": "except ValueError と種類を指定している", "pattern": "except\\s+ValueError\\b", "detail": "裸の except: ではなく except ValueError: と書きます"}, {"kind": "eq", "name": "to_int(\"42\") → 42", "expr": "to_int('42')", "want": "42"}, {"kind": "eq", "name": "to_int(\"abc\") → 0", "expr": "to_int('abc')", "want": "0"}, {"kind": "eq", "name": "to_int(\"3.5\") → 0（int にできない）", "expr": "to_int('3.5')", "want": "0"}, {"kind": "eq", "name": "to_int(\"abc\", -1) → -1", "expr": "to_int('abc', -1)", "want": "-1"}]}, {"id": "with_file", "title": "with文", "desc": "<h2>4-4. with文 — 後片付けを任せる<\/h2>\n<p>3-5で使った <code>with<\/code> の正体は<b>コンテキストマネージャ<\/b>。「使い終わったら必ず閉じる」という後片付けを、<b>途中でエラーが起きても<\/b>確実にやってくれる仕組みです。ファイル以外にもロックやDB接続など「開いたら閉じる」ものすべてに使われます。<\/p>\n<pre>with open(\"data.txt\", encoding=\"utf-8\") as f:\n    first = f.readline()        # 1行だけ読む（末尾に改行が付いてくる）\n    rest = f.readlines()        # 残りを行のリストで<\/pre>\n<p>行末の改行は <code>.strip()<\/code>（前後の空白・改行を除去）で落とすのが定番です。<\/p>\n<p class=\"task\"><b>課題:<\/b> <code>first_line(path)<\/code> はファイルの1行目を（改行を除いて）返す。<code>count_lines(path)<\/code> は行数を返す。どちらも with で開いてください。採点時は <code>song_list.txt<\/code>（3行）が用意されています。<\/p>", "starter": "def first_line(path):\n    # 1行目を読んで .strip() して返す\n    pass\n\n\ndef count_lines(path):\n    # len(f.readlines()) で行数を返す\n    pass\n", "hint": "with open(path, encoding=\"utf-8\") as f: の中で、first_line は return f.readline().strip()、count_lines は return len(f.readlines())。", "solution": "def first_line(path):\n    with open(path, encoding=\"utf-8\") as f:\n        return f.readline().strip()\n\n\ndef count_lines(path):\n    with open(path, encoding=\"utf-8\") as f:\n        return len(f.readlines())", "checks": [{"kind": "source", "name": "with open を使っている", "pattern": "with\\s+open\\s*\\(", "detail": "with open(path, encoding=\"utf-8\") as f: と書きます"}, {"kind": "eq", "name": "first_line(\"song_list.txt\") → \"Voyage\"", "expr": "first_line('song_list.txt')", "want": "'Voyage'"}, {"kind": "eq", "name": "count_lines(\"song_list.txt\") → 3", "expr": "count_lines('song_list.txt')", "want": "3"}], "setup": "from pathlib import Path\nPath(\"song_list.txt\").write_text(\"Voyage\\nAurora\\nNight Drive\\n\", encoding=\"utf-8\")\n"}, {"id": "imports", "title": "import", "desc": "<h2>4-5. import — 道具箱を持ってくる<\/h2>\n<p>Pythonには「電池同梱（batteries included）」と呼ばれる豊富な標準ライブラリがあり、<code>import<\/code> で取り込んで使います。書き方は2通り:<\/p>\n<pre>import math                  # math.sqrt(2) と、モジュール名を付けて使う\nfrom math import sqrt        # sqrt(2) と、直接使う<\/pre>\n<p>基本は <code>import math<\/code> 型（どこから来た関数か一目で分かる）。よく使うものだけ <code>from<\/code> 型にするのがバランスの良い使い分けです。importはファイルの先頭にまとめて書きます。<\/p>\n<p class=\"task\"><b>課題:<\/b> <code>import math<\/code> して、円の面積を返す <code>circle_area(r)<\/code>（<code>math.pi * r * r<\/code>）を作ってください。さらに <code>from math import sqrt<\/code> して、長方形の対角線の長さを返す <code>diagonal(w, h)<\/code>（<code>sqrt(w*w + h*h)<\/code>）も作ってください。<\/p>", "starter": "# import 2種類を書く\n\n# circle_area(r) … math.pi * r * r\n\n# diagonal(w, h) … sqrt(w*w + h*h)\n", "hint": "先頭に import math と from math import sqrt の2行。あとは def を2つ書くだけです。", "solution": "import math\nfrom math import sqrt\n\n\ndef circle_area(r):\n    return math.pi * r * r\n\n\ndef diagonal(w, h):\n    return sqrt(w * w + h * h)", "checks": [{"kind": "source", "name": "import math している", "pattern": "^\\s*import\\s+math\\b", "detail": "import math と1行書きます"}, {"kind": "source", "name": "from math import sqrt している", "pattern": "from\\s+math\\s+import\\s+sqrt\\b", "detail": "from math import sqrt と書きます"}, {"kind": "eq", "name": "circle_area(1) → π", "expr": "circle_area(1) == math.pi", "want": "True"}, {"kind": "eq", "name": "circle_area(2) → 4π", "expr": "circle_area(2) == math.pi * 4", "want": "True"}, {"kind": "eq", "name": "diagonal(3, 4) → 5.0", "expr": "diagonal(3, 4)", "want": "5.0"}]}]}, {"title": "第5章 実践", "resources": [{"label": "公式チュートリアル: 標準ライブラリめぐり", "url": "https://docs.python.org/ja/3/tutorial/stdlib.html"}, {"label": "公式ドキュメント: collections", "url": "https://docs.python.org/ja/3/library/collections.html"}, {"label": "公式ドキュメント: pathlib", "url": "https://docs.python.org/ja/3/library/pathlib.html"}, {"label": "Automate the Boring Stuff（実践集）", "url": "https://automatetheboringstuff.com/"}], "lessons": [{"id": "collections_tools", "title": "collections", "desc": "<h2>5-1. collections — 集計の道具箱<\/h2>\n<p>3-4で手書きした「出現回数の集計」、実は標準ライブラリに専用の道具があります。<\/p>\n<pre>from collections import Counter, defaultdict\n\nCounter([\"a\", \"b\", \"a\"])              # Counter({'a': 2, 'b': 1})\nCounter(words).most_common(1)         # [('a', 2)] — 最多の1件（(値, 回数) のタプル）\n\nd = defaultdict(list)                 # ないキーに触ると自動で [] ができる辞書\nd[\"k\"].append(\"kick\")                 # いきなり append できる<\/pre>\n<p class=\"task\"><b>課題:<\/b> <code>most_common_genre(genres)<\/code> は Counter で最頻ジャンル名を1つ返す。<code>group_by_initial(words)<\/code> は defaultdict(list) で頭文字ごとにまとめた辞書を返す（例: <code>{\"k\": [\"kick\", \"key\"], \"s\": [\"snare\"]}<\/code>。最後に <code>dict(d)<\/code> で普通の辞書に戻す）。<\/p>", "starter": "from collections import Counter, defaultdict\n\n\ndef most_common_genre(genres):\n    # Counter(...).most_common(1) の [0][0] がジャンル名\n    pass\n\n\ndef group_by_initial(words):\n    # d = defaultdict(list) に d[w[0]].append(w) して dict(d) を返す\n    pass\n", "hint": "return Counter(genres).most_common(1)[0][0]。group は for w in words: d[w[0]].append(w) してから return dict(d)。", "solution": "from collections import Counter, defaultdict\n\n\ndef most_common_genre(genres):\n    return Counter(genres).most_common(1)[0][0]\n\n\ndef group_by_initial(words):\n    d = defaultdict(list)\n    for w in words:\n        d[w[0]].append(w)\n    return dict(d)", "checks": [{"kind": "source", "name": "Counter を使っている", "pattern": "\\bCounter\\b", "detail": "from collections import Counter して使います"}, {"kind": "source", "name": "defaultdict を使っている", "pattern": "\\bdefaultdict\\b", "detail": "defaultdict(list) を使います"}, {"kind": "eq", "name": "most_common_genre([\"techno\", \"house\", \"techno\"])", "expr": "most_common_genre(['techno', 'house', 'techno'])", "want": "'techno'"}, {"kind": "eq", "name": "group_by_initial([\"kick\", \"key\", \"snare\"])", "expr": "group_by_initial(['kick', 'key', 'snare'])", "want": "{'k': ['kick', 'key'], 's': ['snare']}"}]}, {"id": "itertools_tools", "title": "itertools", "desc": "<h2>5-2. itertools — 繰り返しの道具箱<\/h2>\n<p>ループの定番パターンを部品化したのが itertools です。今回は2つ:<\/p>\n<pre>from itertools import chain, islice\n\nlist(chain.from_iterable([[1, 2], [3]]))   # [1, 2, 3] — 入れ子を平らに\nlist(islice(range(100), 3))                # [0, 1, 2] — 先頭からn個だけ<\/pre>\n<p><code>islice<\/code> はリスト以外（<code>range<\/code> やジェネレータなど「順に出てくるもの」全般）から先頭を取り出せるのがスライスとの違いです。<\/p>\n<p class=\"task\"><b>課題:<\/b> <code>flatten(lists)<\/code> は chain.from_iterable で入れ子リストを平らに、<code>first_n(iterable, n)<\/code> は islice で先頭n個のリストを返してください。<\/p>", "starter": "from itertools import chain, islice\n\n\ndef flatten(lists):\n    # list(chain.from_iterable(lists))\n    pass\n\n\ndef first_n(iterable, n):\n    # list(islice(iterable, n))\n    pass\n", "hint": "コメントの式をそのまま return するだけです。list() で包むのを忘れずに。", "solution": "from itertools import chain, islice\n\n\ndef flatten(lists):\n    return list(chain.from_iterable(lists))\n\n\ndef first_n(iterable, n):\n    return list(islice(iterable, n))", "checks": [{"kind": "source", "name": "chain を使っている", "pattern": "\\bchain\\b", "detail": "chain.from_iterable(lists) を使います"}, {"kind": "source", "name": "islice を使っている", "pattern": "\\bislice\\b", "detail": "islice(iterable, n) を使います"}, {"kind": "eq", "name": "flatten([[1, 2], [3], [4, 5]])", "expr": "flatten([[1, 2], [3], [4, 5]])", "want": "[1, 2, 3, 4, 5]"}, {"kind": "eq", "name": "flatten([])", "expr": "flatten([])", "want": "[]"}, {"kind": "eq", "name": "first_n(range(100), 3)", "expr": "first_n(range(100), 3)", "want": "[0, 1, 2]"}, {"kind": "eq", "name": "ジェネレータからも取れる", "expr": "first_n((n * n for n in range(10)), 4)", "want": "[0, 1, 4, 9]"}]}, {"id": "pathlib_tools", "title": "pathlib", "desc": "<h2>5-3. pathlib — ファイルとフォルダをオブジェクトで<\/h2>\n<p>パスの文字列連結や存在確認を、<code>Path<\/code> オブジェクトのメソッドですっきり書けます。<\/p>\n<pre>from pathlib import Path\n\np = Path(\"samples\") / \"kick.wav\"    # / でパスを連結！\np.name                               # \"kick.wav\"\np.suffix                             # \".wav\"\nPath(\".\").glob(\"*.wav\")              # パターンに合うファイルを列挙<\/pre>\n<p><code>read_text()<\/code> / <code>write_text()<\/code> を使うと、1行ファイルの読み書きなら open すら不要です。<\/p>\n<p class=\"task\"><b>課題:<\/b> 関数 <code>list_wavs(folder)<\/code> を作ってください。フォルダ内の <code>.wav<\/code> ファイル名（<code>p.name<\/code>）を<b>アルファベット順（sorted）<\/b>のリストで返します。採点時は wav 3つ + それ以外のファイルが置かれた一時フォルダで実行されます。<\/p>", "starter": "from pathlib import Path\n\n\ndef list_wavs(folder):\n    # Path(folder).glob(\"*.wav\") から p.name を集めて sorted で返す\n    pass\n", "hint": "return sorted(p.name for p in Path(folder).glob(\"*.wav\")) の1行です。", "solution": "from pathlib import Path\n\n\ndef list_wavs(folder):\n    return sorted(p.name for p in Path(folder).glob(\"*.wav\"))", "checks": [{"kind": "source", "name": "Path を使っている", "pattern": "\\bPath\\b", "detail": "from pathlib import Path して使います"}, {"kind": "source", "name": "glob を使っている", "pattern": "\\.glob\\s*\\(", "detail": "Path(folder).glob(\"*.wav\") で列挙します"}, {"kind": "eq", "name": "list_wavs(\".\") が wav だけをアルファベット順で", "expr": "list_wavs('.')", "want": "['bass.wav', 'kick.wav', 'snare.wav']"}], "setup": "from pathlib import Path\nfor name in [\"kick.wav\", \"snare.wav\", \"bass.wav\", \"memo.txt\", \"cover.png\"]:\n    Path(name).write_text(\"\", encoding=\"utf-8\")\n"}, {"id": "json_tools", "title": "json", "desc": "<h2>5-4. json — データの保存と交換<\/h2>\n<p>JSONはPythonの辞書・リストとほぼ1対1で行き来できます。<\/p>\n<pre>import json\n\ndata = json.loads(text)                      # JSON文字列 → Pythonのデータ\ntext = json.dumps(data, ensure_ascii=False)  # Pythonのデータ → JSON文字列<\/pre>\n<p><code>ensure_ascii=False<\/code> を付けないと日本語が <code>\\u591c<\/code> のような表記になります。日本語を扱うなら必須と覚えてOK。ファイルから読むなら <code>Path(path).read_text()<\/code> と組み合わせるのが手軽です。<\/p>\n<p class=\"task\"><b>課題:<\/b> <code>load_tracks(path)<\/code> はJSONファイルを読んでデータを返す。<code>to_json(data)<\/code> は <code>ensure_ascii=False<\/code> でJSON文字列にして返す。採点時は <code>tracks.json<\/code> が用意されています。<\/p>", "starter": "import json\nfrom pathlib import Path\n\n\ndef load_tracks(path):\n    # ファイルを読んで json.loads する\n    pass\n\n\ndef to_json(data):\n    # json.dumps(..., ensure_ascii=False)\n    pass\n", "hint": "return json.loads(Path(path).read_text(encoding='utf-8')) と return json.dumps(data, ensure_ascii=False) です。", "solution": "import json\nfrom pathlib import Path\n\n\ndef load_tracks(path):\n    return json.loads(Path(path).read_text(encoding=\"utf-8\"))\n\n\ndef to_json(data):\n    return json.dumps(data, ensure_ascii=False)", "checks": [{"kind": "source", "name": "json.load(s) を使っている", "pattern": "json\\.loads?\\s*\\(", "detail": "json.loads(文字列) または json.load(ファイル) を使います"}, {"kind": "source", "name": "ensure_ascii=False を付けている", "pattern": "ensure_ascii\\s*=\\s*False", "detail": "日本語のために json.dumps(data, ensure_ascii=False) とします"}, {"kind": "eq", "name": "load_tracks(\"tracks.json\")", "expr": "load_tracks('tracks.json')", "want": "[{'title': 'Voyage', 'plays': 120}, {'title': 'Aurora', 'plays': 45}]"}, {"kind": "eq", "name": "to_json で日本語がそのまま出る", "expr": "to_json({'title': '夜間飛行'})", "want": "'{\\\"title\\\": \\\"夜間飛行\\\"}'"}], "setup": "import json\nfrom pathlib import Path\ntracks = [{\"title\": \"Voyage\", \"plays\": 120}, {\"title\": \"Aurora\", \"plays\": 45}]\nPath(\"tracks.json\").write_text(json.dumps(tracks, ensure_ascii=False), encoding=\"utf-8\")\n"}, {"id": "capstone", "title": "卒業課題", "desc": "<h2>5-5. 卒業課題 — 小さな実用スクリプト<\/h2>\n<p>総仕上げです。<b>JSONを読む → 集計する → レポートをファイルに書く<\/b>。ここまでの道具（json・Counter・sorted・f-string・with / write_text）を全部つなげます。<\/p>\n<p class=\"task\"><b>課題:<\/b> 関数 <code>make_report(src, dest)<\/code> を作ってください。<\/p>\n<p><code>src<\/code> は <code>[{\"title\": …, \"genre\": …}, …]<\/code> という形のJSONファイル。ジャンルごとの曲数を数えて、次の形式で <code>dest<\/code> に書き出します:<\/p>\n<pre>ジャンル別レポート\nhouse: 2曲\ntechno: 2曲\nambient: 1曲\n合計: 5曲<\/pre>\n<p>並び順は<b>曲数の多い順、同数ならジャンル名のアルファベット順<\/b>。<code>sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))<\/code> というテクニック（マイナスを付けて降順 + 名前で昇順）が使えます。<\/p>", "starter": "import json\nfrom collections import Counter\nfrom pathlib import Path\n\n\ndef make_report(src, dest):\n    # 1) src のJSONを読む\n    # 2) genre を Counter で数える\n    # 3) 多い順（同数なら名前順）に並べる\n    # 4) レポート文字列を組み立てて dest に書く\n    pass\n", "hint": "tracks = json.loads(Path(src).read_text(...)) → counts = Counter(t[\"genre\"] for t in tracks) → ordered = sorted(counts.items(), key=lambda kv: (-kv[1], kv[0])) → 行のリストを \"\\n\".join して Path(dest).write_text(...)。", "solution": "import json\nfrom collections import Counter\nfrom pathlib import Path\n\n\ndef make_report(src, dest):\n    tracks = json.loads(Path(src).read_text(encoding=\"utf-8\"))\n    counts = Counter(t[\"genre\"] for t in tracks)\n    ordered = sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))\n\n    lines = [\"ジャンル別レポート\"]\n    for genre, count in ordered:\n        lines.append(f\"{genre}: {count}曲\")\n    lines.append(f\"合計: {len(tracks)}曲\")\n\n    Path(dest).write_text(\"\\n\".join(lines) + \"\\n\", encoding=\"utf-8\")", "checks": [{"kind": "source", "name": "json でファイルを読んでいる", "pattern": "json\\.loads?\\s*\\(", "detail": "json.loads / json.load で src を読みます"}, {"kind": "source", "name": "集計している（Counter か .get）", "pattern": "\\bCounter\\b|\\.get\\s*\\(", "detail": "Counter か「counts.get(g, 0) + 1」パターンで数えます"}, {"kind": "eq", "name": "make_report が実行できる", "expr": "make_report('tracks.json', 'report.txt')", "want": "None"}, {"kind": "eq", "name": "report.txt の内容が正しい", "expr": "Path('report.txt').read_text(encoding='utf-8').strip()", "want": "'ジャンル別レポート\\nhouse: 2曲\\ntechno: 2曲\\nambient: 1曲\\n合計: 5曲'"}], "setup": "import json\nfrom pathlib import Path\ntracks = [\n    {\"title\": \"Voyage\", \"genre\": \"techno\"},\n    {\"title\": \"Aurora\", \"genre\": \"house\"},\n    {\"title\": \"Pulse\", \"genre\": \"techno\"},\n    {\"title\": \"Dawn\", \"genre\": \"ambient\"},\n    {\"title\": \"Mist\", \"genre\": \"house\"},\n]\nPath(\"tracks.json\").write_text(json.dumps(tracks, ensure_ascii=False), encoding=\"utf-8\")\n"}]}], "state": {}, "runner": "#!/usr/bin/env python3\n\"\"\"runner.py — 採点ハーネス（py_trainer.py からサブプロセスとして起動される）。\n\n標準入力から JSON（ユーザーのコード + チェック一覧）を受け取り、\nコードを実行して結果を JSON で標準出力に返す。\n\npy_trainer.py が一時ディレクトリを作業場所（cwd）にして起動するので、\nファイルを作る問題でも、本物のファイルを安全に読み書きできる。\n\nチェックの種類:\n    source — ソースコードへの正規表現チェック（\"not\": true なら「書かれていないこと」）\n             コメントは除いてから調べる（初期コードのコメントに反応しないように）\n    eq     — 式を評価して期待値と == 比較（\"type\" があれば型名も確認）\n    stdout — print 出力の確認（\"expr\" なしなら プログラム全体の出力）\n\"\"\"\nfrom __future__ import annotations\n\nimport collections\nimport io\nimport itertools\nimport json\nimport math\nimport re\nimport sys\nimport tokenize\nimport traceback\nfrom contextlib import redirect_stdout\nfrom pathlib import Path\n\nUSER_FILENAME = \"<あなたのコード>\"\nMAX_STDOUT = 10_000  # 暴走した print で結果が溢れないように\n\n# チェック式の評価時に、ユーザーが import していなくても使える名前\nCHECK_EXTRAS = {\n    \"Path\": Path,\n    \"json\": json,\n    \"math\": math,\n    \"collections\": collections,\n    \"itertools\": itertools,\n}\n\n\ndef error_summary(exc: BaseException) -> str:\n    \"\"\"ユーザーコード内の行番号つきで、例外を1行にまとめる。\"\"\"\n    if isinstance(exc, SyntaxError):\n        where = f\"{exc.lineno}行目: \" if exc.lineno else \"\"\n        return f\"{where}SyntaxError: {exc.msg}\"\n    line = None\n    for frame in traceback.extract_tb(exc.__traceback__):\n        if frame.filename == USER_FILENAME:\n            line = frame.lineno\n    where = f\"{line}行目: \" if line else \"\"\n    message = f\"{type(exc).__name__}: {exc}\"\n    if isinstance(exc, NameError):\n        message += \"（名前のタイプミス、または定義し忘れかもしれません）\"\n    return where + message\n\n\ndef strip_comments(code: str) -> str:\n    \"\"\"書き方チェック用に、コメント（# から行末まで）を取り除いたソースを返す。\n\n    文字列の中の # は残す。構文が壊れていても、読めたところまでは取り除く。\n    \"\"\"\n    comments = []\n    try:\n        for tok in tokenize.generate_tokens(io.StringIO(code).readline):\n            if tok.type == tokenize.COMMENT:\n                comments.append(tok)\n    except (tokenize.TokenError, SyntaxError):\n        pass\n    lines = code.splitlines(keepends=True)\n    for tok in comments:\n        (row, start), (_, end) = tok.start, tok.end\n        lines[row - 1] = lines[row - 1][:start] + lines[row - 1][end:]\n    return \"\".join(lines)\n\n\ndef eval_quiet(expr: str, ns: dict) -> tuple:\n    \"\"\"式を評価し、(戻り値, その間の print 出力) を返す。\"\"\"\n    buf = io.StringIO()\n    with redirect_stdout(buf):\n        value = eval(expr, ns)\n    return value, buf.getvalue()\n\n\ndef passed(name: str) -> dict:\n    return {\"pass\": True, \"name\": name, \"detail\": None}\n\n\ndef failed(name: str, detail: str) -> dict:\n    return {\"pass\": False, \"name\": name, \"detail\": detail}\n\n\ndef run_check(check: dict, ns: dict, program_stdout: str) -> dict:\n    name = check[\"name\"]\n    try:\n        if check[\"kind\"] == \"eq\":\n            got, _ = eval_quiet(check[\"expr\"], ns)\n            want, _ = eval_quiet(check[\"want\"], dict(CHECK_EXTRAS))\n            wanted_type = check.get(\"type\")\n            if wanted_type and type(got).__name__ != wanted_type:\n                return failed(name, f\"型が {wanted_type} ではなく {type(got).__name__} になっています\")\n            if got != want:\n                return failed(name, f\"期待値 {want!r} / 実際 {got!r}\")\n            return passed(name)\n        if check[\"kind\"] == \"stdout\":\n            if check.get(\"expr\"):\n                _, out = eval_quiet(check[\"expr\"], ns)\n            else:\n                out = program_stdout\n            if \"want\" in check:\n                if out.rstrip(\"\\n\") != check[\"want\"]:\n                    return failed(name, f\"期待する出力 {check['want']!r} / 実際 {out.rstrip(chr(10))!r}\")\n            elif check[\"contains\"] not in out:\n                return failed(name, f\"出力に {check['contains']!r} が見つかりません（実際の出力: {out!r}）\")\n            return passed(name)\n        return failed(name, f\"不明なチェック種別: {check['kind']}\")\n    except BaseException as exc:  # noqa: BLE001 — 採点は何が起きても結果として返す\n        return failed(name, \"例外: \" + error_summary(exc))\n\n\ndef run(payload: dict) -> dict:\n    code = payload[\"code\"]\n    checks = payload.get(\"checks\", [])\n    results = []\n\n    # 1) 書き方チェック（コードが実行できなくても判定できる）\n    source = strip_comments(code)\n    for check in checks:\n        if check[\"kind\"] != \"source\":\n            continue\n        found = re.search(check[\"pattern\"], source, re.MULTILINE) is not None\n        ok = (not found) if check.get(\"not\") else found\n        results.append(\n            passed(\"[書き方] \" + check[\"name\"]) if ok\n            else failed(\"[書き方] \" + check[\"name\"], check.get(\"detail\") or \"\")\n        )\n\n    # 2) 問題側の準備（入力ファイルの用意など）。cwd は一時ディレクトリ。\n    setup = payload.get(\"setup\")\n    if setup:\n        exec(setup, {\"__name__\": \"__setup__\"})\n\n    # 3) ユーザーコードの実行\n    ns = {\"__name__\": \"__main__\"}\n    buf = io.StringIO()\n    try:\n        compiled = compile(code, USER_FILENAME, \"exec\")\n        with redirect_stdout(buf):\n            exec(compiled, ns)\n    except BaseException as exc:  # noqa: BLE001\n        return {\"error\": error_summary(exc), \"results\": results,\n                \"stdout\": buf.getvalue()[:MAX_STDOUT]}\n    program_stdout = buf.getvalue()\n\n    # 4) 値と出力のチェック\n    check_ns = {**CHECK_EXTRAS, **ns}\n    for check in checks:\n        if check[\"kind\"] == \"source\":\n            continue\n        results.append(run_check(check, check_ns, program_stdout))\n    return {\"error\": None, \"results\": results, \"stdout\": program_stdout[:MAX_STDOUT]}\n\n\nif __name__ == \"__main__\":\n    # 入出力は環境の既定エンコーディング（Windows なら cp932 など）に頼らず UTF-8 で読み、\n    # 結果は ASCII だけの JSON で返す（日本語は \\uXXXX になるが、受け側の json.loads で元に戻る）\n    payload = json.loads(sys.stdin.buffer.read().decode(\"utf-8\"))\n    sys.stdout.write(json.dumps(run(payload)) + \"\\n\")\n"};
const CHAPTERS = PAYLOAD.chapters;
for (const ch of CHAPTERS) for (const l of ch.lessons) l.ch = ch;
const ALL = CHAPTERS.flatMap(ch => ch.lessons);
</script>

<script>
"use strict";

/* ============ 状態管理（進捗＋軽いSRS） ============
   進捗はサーバー経由で py-trainer/state.json に保存される。 */
const MODE = PAYLOAD.mode ?? "server";   // "server" = ローカルのCPython / "static" = ブラウザ内のPyodide
const STORE_KEY = "py-trainer.state.v1";

const isPlainObject = v => typeof v === "object" && v !== null && !Array.isArray(v);
let state = MODE === "static"
  ? (() => { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; } })()
  : PAYLOAD.state;
if (!isPlainObject(state)) state = {};   // 保存内容が壊れていても（数値・文字列・配列など）白紙から始める
if (typeof state.__seq !== "number") state.__seq = 0;
if (!isPlainObject(state.lessons)) state.lessons = {};

let saveTimer = null;
function saveState(immediate = false) {
  clearTimeout(saveTimer);
  const send = () => {
    if (MODE === "static") {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { /* file:// 等で失敗しても続行 */ }
      return;
    }
    fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state),
    }).catch(() => { /* サーバー停止中でも画面は動かし続ける */ });
  };
  if (immediate) send();
  else saveTimer = setTimeout(send, 500);
}

const lessonState = l => state.lessons[l.id];

// 一度でも間違えた問題は、クリア後も「3問クリアするごと」に復習として再出題する
function dueReview(l) {
  const st = lessonState(l);
  return !!(st?.done && (st.lapses ?? 0) > 0 && (state.__seq ?? 0) - (st.clearedSeq ?? 0) >= 3);
}
let current = ALL.find(l => !(lessonState(l)?.done)) ?? ALL.find(dueReview) ?? ALL[0];

/* ============ UI ============ */
const $nav = document.getElementById("nav");
const $desc = document.getElementById("desc");
const $editor = document.getElementById("editor");
const $output = document.getElementById("output");
const $bar = document.querySelector("#progressbar > div");
const isNarrow = () => window.matchMedia("(max-width: 720px)").matches;
document.getElementById("subline").textContent = `書いて覚えるPython全${ALL.length}問`;

function renderNav() {
  $nav.textContent = "";
  for (const ch of CHAPTERS) {
    const h = document.createElement("div");
    h.className = "chapter";
    h.textContent = ch.title;
    $nav.append(h);
    for (const l of ch.lessons) {
      const st = lessonState(l);
      const due = dueReview(l);
      const el = document.createElement("div");
      el.className = "lesson" + (l === current ? " active" : "") + (st?.done ? (due ? " review" : " done") : "");
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = st?.done ? (due ? "🔁" : "✓") : "○";
      const label = document.createElement("span");
      label.textContent = l.title;
      el.append(mark, label);
      el.addEventListener("click", () => {
        selectLesson(l);
        if (isNarrow()) $desc.scrollIntoView({ block: "start" });  // スマホでは問題文へ移動
      });
      $nav.append(el);
    }
  }
  const doneCount = ALL.filter(l => lessonState(l)?.done).length;
  $bar.style.width = `${Math.round(doneCount / ALL.length * 100)}%`;
}

function resBoxHTML(ch) {
  const links = ch.resources.map(r =>
    `<a href="${r.url}" target="_blank" rel="noopener">${r.label}</a>`).join(" ・ ");
  return `<div class="resbox">📚 深めるなら: ${links}<br>${MODE === "static" ? "※採点はブラウザの中のPython（Pyodide）で実行しています。コードはどこにも送信されません。" : "※採点はこのマシンのPython（ローカル）で実行しています。ファイルを作る問題も使い捨てフォルダの中なので安心です。"}</div>`;
}

function selectLesson(lesson) {
  persistCode();
  current = lesson;
  $desc.innerHTML = lesson.desc + resBoxHTML(lesson.ch);
  const saved = lessonState(lesson)?.code;
  $editor.value = saved && saved.trim() ? saved : lesson.starter;
  editorLoaded = true;
  $output.innerHTML = `<span class="muted">コードを書いて「実行して採点」を押してください。</span>`;
  renderNav();
  if (!isNarrow()) $editor.focus();   // スマホでは急にキーボードが出て問題文が隠れるので、自動で入力欄に入らない
}

let editorLoaded = false;
function persistCode() {
  if (!current || !editorLoaded) return;
  state = { ...state, lessons: { ...state.lessons, [current.id]: { ...lessonState(current), code: $editor.value } } };
  saveState();
}

/* ============ ブラウザ内Python（static モードのみ） ============
   採点ロジックは runner.py をそのまま Pyodide に読ませて動かす。
   ローカル版（py_trainer.py）と同じファイルを使うので、判定がズレない。

   Web Worker に閉じ込めてあるのは、無限ループを書いてしまったときに
   タブごと固まらないようにするため。5秒で worker を捨てて作り直す。 */
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v314.0.2/full/pyodide.mjs";
const RUN_TIMEOUT_MS = 5000;
let worker = null, workerReady = null, pyReady = false, jobId = 0;

/* worker は module 形式で作る。この Pyodide は classic worker を受け付けず、
   blob: の worker からは importScripts でクロスオリジン読み込みもできないため、
   ESM 版を動的 import する（wasm の在り処もそこから解決される）。 */
function workerSource() {
  return `
const { loadPyodide } = await import(${JSON.stringify(PYODIDE_URL)});
const pyodide = await loadPyodide();

// runner.py を「ファイルとして置いて import する」。実行ではなく import なので、
// ローカル版で使われる if __name__ == "__main__" の入口（stdin を読む）は動かない。
pyodide.FS.writeFile("/home/pyodide/runner.py", ${JSON.stringify(PAYLOAD.runner ?? "")}, { encoding: "utf8" });
pyodide.runPython([
  "import json, os, shutil, sys, tempfile",
  "sys.path.insert(0, '/home/pyodide')",
  "import runner",
  "def __grade(payload_json):",
  "    payload = json.loads(payload_json)",
  "    work = tempfile.mkdtemp(prefix='py-trainer-')",   // 毎回まっさらな作業場所で採点する
  "    here = os.getcwd()",
  "    try:",
  "        os.chdir(work)",
  "        result = runner.run(payload)",
  "    finally:",
  "        os.chdir(here)",
  "        shutil.rmtree(work, ignore_errors=True)",
  "    return json.dumps(result, ensure_ascii=False)",
].join("\\n"));

self.onmessage = (e) => {
  const { id, payload } = e.data;
  let json;
  try {
    const grade = pyodide.globals.get("__grade");
    json = grade(JSON.stringify(payload));
    grade.destroy();
  } catch (err) {
    json = JSON.stringify({ error: "採点エンジンでエラー: " + String(err), results: [], stdout: "" });
  }
  self.postMessage({ type: "result", id, json });
};
self.postMessage({ type: "ready" });
`;
}

function ensureWorker() {
  if (worker) return workerReady;
  const w = new Worker(URL.createObjectURL(new Blob([workerSource()], { type: "text/javascript" })), { type: "module" });
  worker = w;
  workerReady = new Promise((resolve, reject) => {
    w.addEventListener("error", e => reject(new Error(e.message || "worker error")));
    w.addEventListener("message", function onReady(e) {
      if (e.data.type !== "ready") return;
      w.removeEventListener("message", onReady);
      pyReady = true;
      resolve();
    });
  }).catch(err => {
    if (worker === w) { worker = null; workerReady = null; pyReady = false; }
    throw err;
  });
  return workerReady;
}

function gradeInBrowser(lesson, code) {
  const started = ensureWorker().catch(err => {
    throw new Error("Pythonの読み込みに失敗しました（オフラインではありませんか？）: " + err.message);
  });
  const id = ++jobId;
  const payload = { code, checks: lesson.checks ?? [], setup: lesson.setup ?? null };
  return started.then(() => new Promise(resolve => {
    const w = worker;
    const timer = setTimeout(() => {
      w.terminate();                       // 無限ループごと捨てる
      if (worker === w) { worker = null; workerReady = null; pyReady = false; ensureWorker().catch(() => {}); }
      resolve({ error: "5秒以内に終わりませんでした（無限ループになっていませんか？）", results: [], stdout: "" });
    }, RUN_TIMEOUT_MS);
    const onMsg = e => {
      if (e.data.type !== "result" || e.data.id !== id) return;
      clearTimeout(timer);
      w.removeEventListener("message", onMsg);
      resolve(JSON.parse(e.data.json));
    };
    w.addEventListener("message", onMsg);
    w.postMessage({ id, payload });
  }));
}

let runToken = 0;
async function run() {
  persistCode();
  const token = ++runToken;
  const lesson = current;
  $output.innerHTML = `<span class="muted">${
    MODE === "static"
      ? (pyReady ? "ブラウザの中のPythonで実行中…" : "ブラウザ内のPythonを準備しています…（初回だけ数秒かかります）")
      : "あなたのPythonで実行中…"
  }</span>`;
  let res;
  if (MODE === "static") {
    try {
      res = await gradeInBrowser(lesson, $editor.value);
    } catch (e) {
      res = { error: e.message, results: [], stdout: "" };
    }
  } else {
    try {
      const r = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: lesson.id, code: $editor.value }),
      });
      res = await r.json();
    } catch {
      res = { error: "サーバーに接続できませんでした（py_trainer.py は起動していますか？）", results: [], stdout: "" };
    }
  }
  if (token !== runToken || lesson !== current) return; // 実行中に切替/再実行された
  const { error, results, stdout } = res;
  $output.textContent = "";

  for (const line of (stdout ?? "").split("\n")) {
    if (!line) continue;
    const d = document.createElement("div");
    d.className = "log";
    d.textContent = "› " + line;
    $output.append(d);
  }
  let allPass = !error && (results ?? []).length > 0;
  for (const r of results ?? []) {
    const d = document.createElement("div");
    d.className = "test " + (r.pass ? "pass" : "fail");
    d.textContent = (r.pass ? "✓ " : "✗ ") + r.name + (r.pass || !r.detail ? "" : ` — ${r.detail}`);
    $output.append(d);
    if (!r.pass) allPass = false;
  }
  if (error) {
    const d = document.createElement("div");
    d.className = "err";
    d.textContent = "✗ " + error;
    $output.append(d);
  }
  if (isNarrow()) $output.scrollIntoView({ block: "nearest" });  // 結果はエディタの下にあるので見える位置へ

  const st = lessonState(lesson) ?? {};
  if (!allPass) {
    // 失敗を記録 → クリア済みの問題ならのちほど復習として再出題される
    state = { ...state, lessons: { ...state.lessons, [lesson.id]: { ...st, code: $editor.value, lapses: (st.lapses ?? 0) + 1 } } };
    saveState(true);
    renderNav();
    return;
  }
  const wasDue = dueReview(lesson);
  const seq = (state.__seq ?? 0) + 1;
  state = {
    ...state, __seq: seq,
    lessons: {
      ...state.lessons,
      [lesson.id]: { ...st, code: $editor.value, done: true, clearedSeq: seq, lapses: wasDue ? 0 : (st.lapses ?? 0) },
    },
  };
  saveState(true);
  renderNav();

  const review = ALL.find(l => l !== lesson && dueReview(l));
  const next = ALL.find(l => !(lessonState(l)?.done));
  const d = document.createElement("div");
  if (review) {
    d.className = "review-note";
    d.textContent = `🔁 クリア！ 以前間違えた「${review.title}」が復習に出ています（サイドバーの🔁）`;
  } else if (next) {
    d.className = "celebrate";
    d.textContent = `🎉 クリア！ 次は「${next.title}」へ（サイドバーから選択）`;
  } else {
    d.className = "celebrate";
    d.textContent = "🏆 全問クリア！おめでとうございます！";
  }
  $output.append(d);
  if (isNarrow()) d.scrollIntoView({ block: "nearest" });
}

function showHint() {
  const box = document.createElement("div");
  box.className = "hintbox";
  box.textContent = "💡 " + current.hint;
  $output.append(box);
  box.scrollIntoView({ block: "nearest" });
}

function showSolution() {
  const box = document.createElement("div");
  box.className = "hintbox";
  const label = document.createElement("div");
  label.textContent = "📖 解答例（まず自力で5分は粘るのがおすすめ）";
  const pre = document.createElement("pre");
  pre.textContent = current.solution;
  box.append(label, pre);
  $output.append(box);
  box.scrollIntoView({ block: "nearest" });
}

document.getElementById("btn-run").addEventListener("click", run);
document.getElementById("btn-hint").addEventListener("click", showHint);
document.getElementById("btn-solution").addEventListener("click", showSolution);
document.getElementById("btn-reset").addEventListener("click", () => {
  $editor.value = current.starter;
  persistCode();
});

$editor.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); run(); }
  if (e.key === "Tab") {
    e.preventDefault();
    const { selectionStart: s, selectionEnd: end, value } = $editor;
    $editor.value = value.slice(0, s) + "    " + value.slice(end);
    $editor.selectionStart = $editor.selectionEnd = s + 4;
  }
});
$editor.addEventListener("input", () => persistCode());

renderNav();
selectLesson(current);
if (MODE === "static") ensureWorker().catch(() => { /* 失敗は「実行して採点」を押したときに表示する */ });
</script>
</body>
</html>
